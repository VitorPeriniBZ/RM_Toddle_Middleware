# nginx do apps/web em produção: serve o estático do Vite e faz proxy de /api
# para o serviço da API no mesmo domínio.
#
# Por que proxy em vez de a UI chamar a API por URL absoluta: mesma origem
# elimina o CORS no caminho UI -> API, e o domínio não fica gravado no bundle.
# Ver o comentário em apps/web/src/api.ts.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A API só é alcançada por aqui. O serviço `api` NÃO publica porta no host
    # (ver docker-compose.coolify.yml) — o único caminho até ele é este proxy.
    location /api/ {
        # A barra final em /api/ e no proxy_pass remove o prefixo: uma chamada a
        # /api/health chega na API como /health. Sem ela, viraria /api/health e
        # daria 404 em todas as rotas.
        proxy_pass http://api:3333/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # O Coolify termina o TLS na frente; sem isto a API se vê como http.
        proxy_set_header X-Forwarded-Proto $scheme;

        # O Authorization com o id_token do Google precisa passar intacto.
        proxy_pass_request_headers on;
    }

    # SPA: qualquer rota desconhecida devolve o index, e o React resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets do Vite têm hash no nome, então podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index NUNCA é cacheado: é ele que aponta para os assets novos depois de
    # um deploy. Cachear aqui é como se serve front velho por horas.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
